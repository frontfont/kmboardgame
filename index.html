<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d0f06">
<meta name="color-scheme" content="dark">
<title>Brew &amp; Brawl: Craft Beer Card Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Bungee&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  body{min-height:100vh;color:#fde7b8;font-family:'Sarabun','Noto Sans Thai',system-ui,sans-serif;overflow-x:hidden;background:radial-gradient(900px 500px at 50% -5%,#8a552655,transparent 65%),radial-gradient(ellipse at center,#3a2112 0%,#1d0f06 62%,#0b0502 100%);background-attachment:fixed}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:repeating-linear-gradient(90deg,#0000 0 118px,#0000002e 118px 120px)}
  #app{position:relative;z-index:1}
  .bubble{position:fixed;bottom:-40px;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(circle at 30% 30%,#fff9,#f5b53a26 60%,transparent);animation:rise linear infinite}
  @keyframes rise{to{transform:translateY(-115vh) translateX(20px)}}
  .logo{font-family:'Bungee','Mitr',sans-serif;font-size:clamp(1.9rem,8vw,3.4rem);line-height:1;letter-spacing:.03em;background:linear-gradient(#fff4c2 10%,#ffc43d 50%,#b4600a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #5a2f08) drop-shadow(0 7px 0 #2b1405) drop-shadow(0 12px 14px #000b)}
  .sub{font-family:'Bungee','Mitr',sans-serif;letter-spacing:.25em;font-size:.68rem;color:#e0a85a;margin-top:.7rem}
  .mug{font-size:3.4rem;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 8px 6px #000a)}
  .compact .mug,.compact .emblem{display:none}
  .emblem{position:relative;width:5.5rem;height:4.4rem;margin:0 auto .3rem;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 8px 6px #000a)}
  .emblem .sw{position:absolute;inset:0;text-align:center;font-size:4.4rem;line-height:1}
  .emblem .mg{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);font-size:2.5rem;line-height:1}
  .vs{text-align:center;font-family:'Bungee',sans-serif;color:#e0a85a;letter-spacing:.3em;font-size:.75rem;margin:-.4rem 0 1rem;text-shadow:0 2px 0 #000a}.compact .logo{font-size:clamp(1.6rem,6vw,2.3rem)}
  @keyframes float{50%{transform:translateY(-8px) rotate(-4deg)}}
  .wood{position:relative;border-radius:1.25rem;background:linear-gradient(180deg,#4b2c16,#2c180b);border:3px solid #8a5526;box-shadow:inset 0 2px 0 #ffc77a40,inset 0 -6px 14px #0008,0 10px 0 #1a0d05,0 18px 30px #000a}
  .wood::after{content:"";position:absolute;inset:6px;border-radius:.9rem;border:1px solid #f5b53a30;pointer-events:none}
  .turn{border-color:#ffd56a!important;animation:glow 1.6s ease-in-out infinite}
  @keyframes glow{0%,100%{box-shadow:inset 0 2px 0 #ffc77a40,inset 0 -6px 14px #0008,0 10px 0 #1a0d05,0 0 14px #f5b53a66}50%{box-shadow:inset 0 2px 0 #ffc77a40,inset 0 -6px 14px #0008,0 10px 0 #1a0d05,0 0 34px #f5b53acc}}
  .btn{font-family:'Mitr',sans-serif;font-weight:500;font-size:1.05rem;color:#2a1306;border-radius:.9rem;padding:.75rem 1.2rem;background:linear-gradient(#ffd56a,#f0a020 55%,#c47a0e);border:2px solid #7a4308;box-shadow:inset 0 2px 0 #fff8,0 5px 0 #7a4308,0 9px 12px #0008;text-shadow:0 1px 0 #fff6;transition:transform .08s,filter .15s}
  .btn:hover:not(:disabled){filter:brightness(1.1)}
  .btn:active:not(:disabled){transform:translateY(4px);box-shadow:inset 0 2px 0 #fff8,0 1px 0 #7a4308}
  .btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.7)}
  .btn.alt{background:linear-gradient(#e9a36b,#b8642c 55%,#8a3f16);color:#fff;border-color:#4d1f08;box-shadow:inset 0 2px 0 #fff5,0 5px 0 #4d1f08,0 9px 12px #0008;text-shadow:0 2px 0 #0006}
  .abtn{display:flex;flex-direction:column;align-items:center;gap:.1rem;padding:.8rem .3rem;border-radius:1rem;font-family:'Mitr',sans-serif;color:#fff;border:2px solid #0006;box-shadow:inset 0 3px 0 #fff5,inset 0 -6px 10px #0004,0 6px 0 var(--sh),0 12px 14px #000a;text-shadow:0 2px 0 #0007;transition:transform .08s}
  .abtn .ai{font-size:2rem;filter:drop-shadow(0 3px 2px #0007)}.abtn .at{font-size:1rem;font-weight:500}.abtn .as{font-size:.66rem;opacity:.85}
  .abtn:hover:not(:disabled){transform:translateY(-3px)}
  .abtn:active:not(:disabled){transform:translateY(4px);box-shadow:inset 0 3px 0 #fff5,0 2px 0 var(--sh)}
  .abtn:disabled{filter:grayscale(.85) brightness(.55);cursor:not-allowed}
  .abtn.draw{--sh:#7a4308;background:linear-gradient(#ffc94d,#e08a10)}
  .abtn.trade{--sh:#0c4f66;background:linear-gradient(#4cc3e8,#1b7fa8)}
  .abtn.brew{--sh:#1f5a1a;background:linear-gradient(#8fdc52,#3c9a2a)}
  .abtn.ready:not(:disabled){animation:ready 1.2s infinite}
  @keyframes ready{50%{filter:brightness(1.25) drop-shadow(0 0 10px #b6ff7a)}}
  .inp{font-family:'Mitr','Sarabun',sans-serif;font-size:1.1rem;background:linear-gradient(#150a04,#1f1008);border:2px solid #7a4a22;border-radius:.85rem;padding:.8rem 1rem;color:#ffe7b0;width:100%;box-shadow:inset 0 3px 8px #000b,0 1px 0 #ffc77a22;transition:border-color .15s,box-shadow .15s}
  .inp::placeholder{color:#b88a55;opacity:.55}
  .inp:focus{outline:none;border-color:#f5b53a;box-shadow:inset 0 3px 8px #000b,0 0 0 3px #f5b53a33}
  .inp.code{font-family:'Bungee',sans-serif;font-size:1.5rem;letter-spacing:.5em;text-align:center;text-transform:uppercase;color:#ffc43d;text-shadow:0 2px 0 #5a2f08;padding:.7rem .5rem .7rem 1.1rem}
  .inp.code::placeholder{font-family:'Mitr',sans-serif;font-size:.95rem;letter-spacing:.3em;text-shadow:none}
  .lobby{padding:1.9rem 1.6rem 1.6rem}
  .lbl{display:block;font-family:'Mitr',sans-serif;font-weight:500;font-size:.95rem;color:#ffc43d;margin-bottom:.6rem;letter-spacing:.02em}
  .or{display:flex;align-items:center;gap:.9rem;margin:1.8rem 0;font-family:'Mitr',sans-serif;font-size:.8rem;color:#c99a5a}
  .or::before,.or::after{content:"";flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#8a5526)}
  .or::after{background:linear-gradient(270deg,transparent,#8a5526)}
  .hint{margin-top:1.7rem;padding-top:1.2rem;border-top:1px dashed #8a552666;text-align:center;font-size:.82rem;line-height:1.7;color:#c9a46d}
  .hand{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;perspective:800px;padding:18px 0 8px;background:radial-gradient(ellipse at 50% 100%,#0009,transparent 70%)}
  .gwrap{position:relative;width:148px;height:219px;transform-style:preserve-3d;transition:transform .2s}
  .gwrap:hover{transform:translateY(-10px) rotateX(8deg) rotateZ(-2deg)}
  .gwrap.sm{width:72px;height:107px}
  .gwrap.empty{filter:grayscale(1) brightness(.45);opacity:.75}
  .cnt{position:absolute;top:-12px;right:-12px;z-index:3;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bungee',sans-serif;font-size:1rem;color:#2a1306;background:linear-gradient(#ffd56a,#c47a0e);border:3px solid #2a1306;box-shadow:0 3px 0 #0008}
  .avatar{flex:none;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bungee','Mitr',sans-serif;color:#fff;font-size:1.1rem;border:3px solid #ffd56a;box-shadow:0 3px 0 #000a,inset 0 -4px 6px #0005;text-shadow:0 2px 0 #0006}
  .pips{display:flex;gap:2px;font-size:1.05rem}.pip{filter:grayscale(1) brightness(.45);opacity:.6}.pip.on{filter:none;opacity:1;text-shadow:0 0 10px #ffc43d}
  .chip{display:inline-flex;align-items:center;gap:.3rem;background:#1a0d05;border:1px solid #8a5526;border-radius:999px;padding:.15rem .7rem;font-size:.9rem;box-shadow:inset 0 2px 4px #000a}
  .tag{font-family:'Mitr',sans-serif;font-size:.7rem;background:#f5b53a;color:#2a1306;border-radius:999px;padding:.1rem .6rem;animation:blink 1.2s infinite}
  @keyframes blink{50%{opacity:.55}}
  .ribbon{font-family:'Mitr',sans-serif;text-align:center;padding:.55rem 2.5rem;margin:0 auto 1.2rem;max-width:26rem;color:#d9b98a;background:linear-gradient(#3b2312,#24130a);clip-path:polygon(0 0,100% 0,calc(100% - 16px) 50%,100% 100%,0 100%,16px 50%)}
  .ribbon.mine{color:#2a1306;font-weight:600;background:linear-gradient(#ffe08a,#f0a020);animation:blink 1.4s infinite}
  .recipe{display:flex;align-items:center;justify-content:center;gap:.45rem;color:#c99a5a}
  .rslot{position:relative;width:38px;height:38px;border-radius:.6rem;background:#1a0d05;border:2px solid #5a3a1c;display:flex;align-items:center;justify-content:center;font-size:1.3rem;opacity:.5;filter:grayscale(.8)}
  .rslot.ok{opacity:1;filter:none;border-color:#ffd56a;box-shadow:0 0 10px #f5b53a88}
  .rslot.ok:not(.brewout)::after{content:"✓";position:absolute;right:-6px;bottom:-6px;width:16px;height:16px;border-radius:50%;background:#3fb950;color:#fff;font-size:.65rem;display:flex;align-items:center;justify-content:center;border:2px solid #1a0d05}
  .conf{position:fixed;top:-20px;width:9px;height:15px;z-index:45;pointer-events:none;animation:fall 3.2s linear infinite}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
  .evbar{max-width:34rem;margin:-.4rem auto 1.1rem;padding:.55rem 1rem;border-radius:.8rem;text-align:center;font-size:.85rem;line-height:1.5;color:#ffe9c2;background:linear-gradient(#7a2a1a,#4d1a10);border:2px solid #d9603a;box-shadow:inset 0 2px 0 #ffb08a40,0 4px 0 #2a0c06}
  .evicon{font-size:4rem;line-height:1;animation:float 2.4s ease-in-out infinite;filter:drop-shadow(0 8px 6px #000a)}
  .evtag{font-family:'Bungee','Mitr',sans-serif;font-size:.6rem;letter-spacing:.2em;color:#e0a85a;margin:.6rem 0 .3rem}
  .evtitle{font-family:'Mitr',sans-serif;font-weight:600;font-size:1.55rem;line-height:1.3;color:#ffc43d;text-shadow:0 3px 0 #5a2f08}
  .evdesc{margin:.6rem 0 1rem;color:#fde7b8;line-height:1.6}
  .evinfo{margin:0 0 1rem;padding:.6rem .8rem;border-radius:.7rem;background:#1a0d05;border:1px dashed #d9a25a;font-size:.9rem;line-height:1.6;color:#ffe2a8}
  .evtag.rare{color:#ff9bf0;text-shadow:0 0 12px #d98cff}
  .rare-t{color:#ffb6f5;text-shadow:0 3px 0 #5a1a5a,0 0 18px #d98cff}
  .pickc{display:flex;flex-direction:column;align-items:center;gap:.1rem;width:76px;padding:.55rem .2rem;border-radius:.8rem;background:#1a0d05;border:2px solid #8a5526;font-size:1.7rem;line-height:1.2;box-shadow:inset 0 2px 6px #000a;transition:transform .1s,border-color .1s}
  .pickc span{font-family:'Mitr',sans-serif;font-size:.75rem}.pickc b{font-family:'Bungee',sans-serif;font-size:.8rem;color:#ffc43d}
  .pickc:hover:not(:disabled){transform:translateY(-3px);border-color:#ffd56a;box-shadow:0 0 14px #f5b53a88}
  .pickc:disabled{opacity:.3;cursor:not-allowed}
  .avatar{position:relative}
  .avatar::after{content:"";position:absolute;right:-3px;bottom:-3px;width:13px;height:13px;border-radius:50%;border:2px solid #1a0d05;background:#6b6b6b}
  .avatar.on::after{background:#3fe05a;box-shadow:0 0 8px #3fe05a}
  .timer{display:flex;align-items:center;gap:.7rem;max-width:26rem;margin:-.5rem auto 1.1rem;font-family:'Mitr',sans-serif;font-size:.8rem;color:#e0c08a}
  .tbar{flex:1;height:10px;border-radius:99px;background:#1a0d05;border:1px solid #6b4220;box-shadow:inset 0 2px 4px #000a;overflow:hidden}
  .tbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(#ffd56a,#e08a10);transition:width .25s linear}
  .timer span{min-width:5.8rem;text-align:right}
  .timer.low{color:#ffb3a0;animation:blink .6s infinite}
  .timer.low .tbar i{background:linear-gradient(#ff8a6b,#d6453d)}
  .hostbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:center;margin:-.3rem 0 1rem;font-size:.8rem;color:#e0a85a}
  .hostbar .chip{cursor:pointer}
  .kick{position:absolute;bottom:.55rem;right:.7rem;z-index:2;font-family:'Mitr',sans-serif;font-size:.7rem;background:#3a1710;border:1px solid #b34a32;color:#ffb3a0;border-radius:999px;padding:.1rem .65rem}
  .kick:hover{background:#6b2418}
  .logbox{margin-top:1.3rem;padding:.7rem .9rem;border-radius:1rem;background:linear-gradient(#2a170b,#1d0f06);border:2px solid #5a3a1c;box-shadow:inset 0 2px 8px #000a}
  .logh{font-family:'Mitr',sans-serif;font-size:.8rem;color:#e0a85a;margin-bottom:.4rem}
  .logl{max-height:8.5rem;overflow-y:auto;font-size:.82rem;line-height:1.55}
  .logi{padding:.15rem 0;border-bottom:1px dashed #5a3a1c66;color:#d9bf92}
  .logi:first-child{color:#ffe7b0;font-weight:600}
  .logi.event{color:#ffb88a}.logi.brew{color:#b9f27a}.logi.win{color:#ffd56a}.logi.skip,.logi.kick,.logi.timeout{color:#ff9d8a}
  .flyc{position:fixed;z-index:60;width:56px;height:78px;border-radius:10px;background:linear-gradient(#fff6d6,#e3c585);display:flex;align-items:center;justify-content:center;font-size:2rem;box-shadow:0 8px 16px #000a;pointer-events:none}
  .plus1{position:fixed;z-index:60;font-family:'Bungee',sans-serif;font-size:1.3rem;color:#ffd56a;text-shadow:0 2px 0 #5a2f08,0 0 12px #f5b53a;pointer-events:none}
  .flash{position:fixed;inset:0;z-index:35;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,#d6453d99)}
  .acards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .acard{position:relative;width:104px;min-height:138px;padding:.5rem .45rem;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:.15rem;text-align:center;color:#2a1306;background:linear-gradient(#ffe9b0,#e6c06a);border:2px solid #8a5526;box-shadow:inset 0 2px 0 #fff8,0 5px 0 #5a3a1c,0 10px 12px #000a;transition:transform .12s}
  .acard:hover:not(:disabled){transform:translateY(-6px) rotate(-1.5deg)}
  .acard:disabled{filter:grayscale(.85) brightness(.6);cursor:not-allowed}
  .acard.rare{background:linear-gradient(#f3d9ff,#b98be8);border-color:#6a2fb0;box-shadow:inset 0 2px 0 #fff9,0 5px 0 #3b1a66,0 0 16px #b98be888,0 10px 12px #000a}
  .acard .ar{font-family:'Bungee',sans-serif;font-size:.5rem;letter-spacing:.15em;opacity:.7}
  .acard .ai{font-size:2rem;line-height:1.1}
  .acard .an{font-family:'Mitr',sans-serif;font-weight:600;font-size:.88rem;line-height:1.2}
  .acard .ad{font-size:.66rem;line-height:1.3;opacity:.85}
  .fxbar{max-width:34rem;margin:-.3rem auto 1rem;padding:.5rem 1rem;border-radius:.8rem;text-align:center;font-size:.82rem;line-height:1.5;color:#f1e0ff;background:linear-gradient(#4a2a78,#2e1850);border:2px solid #9a6be0;box-shadow:inset 0 2px 0 #fff3}
  .logi.card{color:#d9b6ff}
  /* touch: ไม่ซูมเมื่อแตะ 2 ที (ยังซูมด้วยการ์ดนิ้วถ่างได้) */
  html{touch-action:manipulation;-webkit-text-size-adjust:100%}
  body{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;min-height:100dvh}
  button,.gwrap,.acard,.abtn,.chip{touch-action:manipulation}
  input{-webkit-user-select:text;user-select:text}
  .fixed.inset-0{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .fixed.inset-0>*{margin:auto}
  .oppgrid{display:grid;gap:.75rem;margin-bottom:1.25rem;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .actbar{margin-top:1.5rem}
  .logh{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left}
  /* มือถือ: จัดหน้าให้กระชับ เห็นครบในจอเดียว */
  @media (max-width:640px){
    #app{padding:.65rem .65rem 1rem}
    .logo{font-size:clamp(1.7rem,9vw,2.4rem)}
    .compact .logo{font-size:1.45rem}
    .sub{display:none}
    .emblem{width:4rem;height:3.2rem}.emblem .sw{font-size:3.2rem}.emblem .mg{font-size:1.9rem}
    .wood{border-width:2px;border-radius:1rem;box-shadow:inset 0 2px 0 #ffc77a40,inset 0 -4px 10px #0008,0 6px 0 #1a0d05,0 10px 18px #000a}
    .wood.p-4,.wood.p-3{padding:.7rem}
    .wood.p-5,.wood.p-6,.wood.p-8{padding:1rem}
    .lobby{padding:1.3rem 1.1rem 1.2rem}
    .oppgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem;margin-bottom:.8rem}
    .oppgrid .wood{padding:.5rem .6rem}
    .oppgrid .avatar{width:32px;height:32px;font-size:.9rem;border-width:2px}
    .oppgrid .chip{padding:.05rem .4rem;font-size:.72rem}
    .oppgrid .pips{font-size:.85rem}
    .oppgrid .font-bold{font-size:.85rem}
    .oppgrid .tag{display:none}
    .kick{bottom:.35rem;right:.45rem;font-size:.62rem;padding:.05rem .5rem}
    .vs{margin:-.2rem 0 .6rem}
    .ribbon{padding:.35rem 1.6rem;margin-bottom:.6rem;font-size:.88rem}
    .timer{margin:-.2rem auto .6rem;font-size:.72rem}.timer span{min-width:4.8rem}
    .hostbar{margin:-.2rem 0 .6rem}
    .evbar,.fxbar{margin:-.2rem auto .6rem;padding:.4rem .7rem;font-size:.75rem}
    .recipe{gap:.3rem}.rslot{width:30px;height:30px;font-size:1.05rem;border-radius:.5rem}
    .hand{flex-wrap:nowrap;gap:8px;padding:12px 0 4px}
    .hand .gwrap{width:calc(25% - 6px);height:auto;aspect-ratio:148/219}
    .hand .cnt{width:26px;height:26px;font-size:.78rem;top:-8px;right:-6px;border-width:2px}
    .acards{flex-wrap:nowrap;gap:8px}
    .acard{width:calc(33.333% - 6px);min-height:0;padding:.4rem .3rem;border-radius:10px}
    .acard .ai{font-size:1.5rem}.acard .an{font-size:.72rem}.acard .ad{font-size:.58rem}.acard .ar{font-size:.45rem}
    .actbar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 4px);z-index:20;margin-top:.9rem;padding:.5rem;border-radius:1rem;background:linear-gradient(#3b2312ee,#24130aee);border:2px solid #8a5526;box-shadow:0 -6px 16px #000a;backdrop-filter:blur(4px)}
    .actbar.grid{gap:.5rem}
    .abtn{padding:.55rem .2rem;border-radius:.8rem}.abtn .ai{font-size:1.5rem}.abtn .at{font-size:.82rem}.abtn .as{font-size:.55rem;text-align:center}
    .logbox{margin-top:.9rem;padding:.55rem .7rem}.logl{max-height:6.5rem}
    .pickc{width:64px}
    #musicBtn{width:2.5rem;height:2.5rem;font-size:1.2rem}
  }
  .coinbox{height:200px;display:flex;align-items:center;justify-content:center;margin:.4rem 0 .8rem}
  .coinhop{perspective:900px}
  .coinhop.hop{animation:coinhop 2.4s cubic-bezier(.3,.6,.4,1) both}
  @keyframes coinhop{0%{transform:translateY(0) scale(1)}45%{transform:translateY(-70px) scale(1.2)}100%{transform:translateY(0) scale(1)}}
  .coin{position:relative;width:150px;height:150px;transform-style:preserve-3d}
  .coin.cf-idle{animation:coinidle 4s ease-in-out infinite}
  @keyframes coinidle{0%,100%{transform:rotateY(-20deg)}50%{transform:rotateY(20deg)}}
  .coin.cf-head{animation:coinspinh 2.4s cubic-bezier(.2,.7,.3,1) both}
  .coin.cf-tail{animation:coinspint 2.4s cubic-bezier(.2,.7,.3,1) both}
  @keyframes coinspinh{from{transform:rotateY(0deg)}to{transform:rotateY(1800deg)}}
  @keyframes coinspint{from{transform:rotateY(0deg)}to{transform:rotateY(1980deg)}}
  .cface{position:absolute;inset:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;-webkit-backface-visibility:hidden;backface-visibility:hidden;background:radial-gradient(circle at 35% 30%,#fff1a8 0%,#ffc43d 45%,#b4600a 100%);border:6px solid #7a4308;box-shadow:inset 0 0 0 5px #ffe08a,inset 0 -10px 18px #5a2f0866,0 10px 18px #000a}

  .duelres{margin-top:.8rem;font-family:'Mitr',sans-serif;font-size:1.3rem;line-height:1.5;color:#ffc43d;text-shadow:0 2px 0 #5a2f08}

  .cbanner{display:flex;align-items:center;gap:.9rem;max-width:26rem;padding:.7rem 1.2rem;border-radius:1.1rem;background:linear-gradient(#4b2c16,#2c180b);border:3px solid #ffd56a;box-shadow:0 10px 0 #1a0d05,0 0 30px #f5b53aaa;color:#fde7b8}
  .cbanner.rare{border-color:#b98be8;box-shadow:0 10px 0 #1a0d05,0 0 34px #b98be8cc}
  .cbanner.danger{border-color:#ff6b4a;background:linear-gradient(#6b2418,#3a1210);box-shadow:0 10px 0 #1a0d05,0 0 34px #ff6b4acc}
  .cbanner .ci{font-size:2.6rem;line-height:1;filter:drop-shadow(0 3px 2px #0007)}
  .cbanner .ct{font-family:'Mitr',sans-serif;line-height:1.35}
  .cbanner .ct b{display:block;font-size:1.1rem;color:#ffc43d}
  .cbanner.danger .ct b{color:#ffb3a0}
  .cbanner .ct span{font-size:.85rem;color:#e6cfa0}

  .gback{filter:brightness(.78);box-shadow:0 6px 10px #0008}

  .gshine::after{content:"";position:absolute;inset:-40% -60%;background:linear-gradient(105deg,transparent 40%,#ffffff55 50%,transparent 60%);transform:translateX(-60%);transition:transform .7s}

  .mini{display:block;position:relative;width:100%;aspect-ratio:148/219}

  .mini.sel img{box-shadow:0 0 0 3px #ffd56a,0 0 18px #f5b53acc,0 6px 0 #0007}
  .mini.dim img{opacity:.55}
  .ico{display:inline-block;width:1.4em;height:1.4em;border-radius:50%;vertical-align:-.35em;object-fit:cover;box-shadow:0 1px 3px #000a}
  .chip .ico{width:1.5em;height:1.5em;margin-right:.2rem}
  .rslot .ico{width:86%;height:86%;vertical-align:middle;margin:0}
  .pickc{width:76px;padding:.35rem .3rem .45rem;font-size:1rem}
  .flyc{width:56px;height:83px;background:none;padding:0;overflow:hidden;border-radius:6%/4%;box-shadow:0 8px 16px #000a}

const KEYS=Object.keys(ING), WIN=3, MAXP=8;
let me=null, room=null, players=[], chan=null, tradeOpen=false, give={water:0,malt:0,hops:0,yeast:0}, want=null, busy=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.add('hidden'),2800)}
const sorted=()=>[...players].sort((a,b)=>a.seat-b.seat);
const current=()=>{const s=sorted();return room&&s.length?s[room.current_turn%s.length]:null};
const myTurn=()=>room&&room.status==='playing'&&current()?.id===me?.id;
const mine=()=>players.find(p=>p.id===me?.id)||me;

/* ---------- Lobby ---------- */
function code(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from({length:5},()=>a[Math.random()*a.length|0]).join('')}
async function createRoom(){
  const name=$('#name').value.trim(); if(!name) return toast('ใส่ชื่อผู้เล่นก่อน');
  const {data:r,error}=await db.from('rooms').insert({code:code(),status:'waiting',current_turn:0}).select().single();
  if(error) return toast('สร้างห้องไม่สำเร็จ: '+error.message);
  await enter(r,name,0,true);
}
async function joinRoom(){
  const name=$('#name').value.trim(), c=$('#code').value.trim().toUpperCase();
  if(!name||!c) return toast('ใส่ชื่อและ Room Code');
  const {data:r}=await db.from('rooms').select().eq('code',c).maybeSingle();
  if(!r) return toast('ไม่พบห้องนี้');
  const {data:all}=await db.from('players').select().eq('room_id',r.id);
  const ps=all.filter(x=>!x.kicked), same=all.find(x=>x.name===name);
  if(same?.kicked) return toast('คุณถูกเตะออกจากห้องนี้แล้ว');
  if(same){ return enter(r,name,same.seat,false,same); }
  if(r.status!=='waiting') return toast('เกมเริ่มไปแล้ว');
  if(ps.length>=MAXP) return toast('ห้องเต็ม (สูงสุด '+MAXP+' คน)');
  await enter(r,name,Math.max(-1,...all.map(x=>x.seat))+1,false);
}
async function enter(r,name,seat,host,existing){
  let p=existing;
  if(!p){
    const {data,error}=await db.from('players').insert({room_id:r.id,name,seat,water:0,malt:0,hops:0,yeast:0,beer_points:0}).select().single();
    if(error) return toast('เข้าห้องไม่สำเร็จ: '+error.message);
    p=data;
  }
  localStorage.setItem('bw_player',p.id); localStorage.setItem('bw_room',r.id);
  me=p; room=r; await load(); subscribe(); render();
}
async function leave(){
  if(chan) db.removeChannel(chan); chan=null;
  localStorage.removeItem('bw_player'); localStorage.removeItem('bw_room');
  me=null;room=null;players=[];logs=[];soundedId=0;lastEvKey=undefined;onlineIds=new Set(); render();
}
async function restore(){
  const pid=localStorage.getItem('bw_player'), rid=localStorage.getItem('bw_room');
  if(!pid||!rid) return render();
  const {data:p}=await db.from('players').select().eq('id',pid).maybeSingle();
  const {data:r}=await db.from('rooms').select().eq('id',rid).maybeSingle();
  if(!p||!r) return leave();
  me=p;room=r; await load(); subscribe(); render();
}

/* ---------- Realtime ---------- */
async function load(){
  const [{data:r},{data:ps},{data:lg}]=await Promise.all([
    db.from('rooms').select().eq('id',room.id).single(),
    db.from('players').select().eq('room_id',room.id),
    db.from('game_log').select().eq('room_id',room.id).order('id',{ascending:false}).limit(30)
  ]);
  if(r) room=r;
  if(ps){
    const self=ps.find(x=>x.id===me?.id);
    if(me&&self?.kicked){toast('คุณถูกเตะออกจากห้อง');await leave();return}
    players=ps.filter(x=>!x.kicked);
  }
  if(lg){logs=lg.reverse(); if(!soundedId) soundedId=Math.max(0,...logs.map(x=>x.id))}
}
function subscribe(){
  if(chan) db.removeChannel(chan);
  const refresh=async()=>{await load();render()};
  chan=db.channel('brew-'+room.id,{config:{presence:{key:me.id}}})
    .on('presence',{event:'sync'},()=>{onlineIds=new Set(Object.keys(chan.presenceState()));render()})
    .on('postgres_changes',{event:'*',schema:'public',table:'players',filter:'room_id=eq.'+room.id},refresh)
    .on('postgres_changes',{event:'*',schema:'public',table:'rooms',filter:'id=eq.'+room.id},refresh)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'game_log',filter:'room_id=eq.'+room.id},pl=>{
      const r=pl.new; if(!logs.some(x=>x.id===r.id)) logs=[...logs,r].slice(-30);
      if(r.id>soundedId){soundedId=r.id;onLog(r)}
      render();
    })
    .subscribe(st=>{if(st==='SUBSCRIBED') chan.track({at:Date.now()})});
}

/* ---------- Game actions ---------- */
const nextTurn=()=>(room.current_turn+1)%sorted().length;
async function startGame(){
  if(players.length<2) return toast('ต้องมีผู้เล่นอย่างน้อย 2 คน');
  await Promise.all(players.map(x=>db.from('players').update({cards:[pickCard(),pickCard(),pickCard()]}).eq('id',x.id)));
  await db.from('rooms').update({status:'playing',current_turn:0,winner_id:null,turn_count:0,event:null,event_key:null,event_round:0,event_info:null,turn_deadline:Date.now()+TURN_SECS*1000,card_used_turn:-1,turn_fx:[],next_event:rollEvent(),duel_state:null,duel_caller:null}).eq('id',room.id);
}
async function act(fn){
  if(busy||!myTurn()||anyPending()) return; busy=true;
  try{await fn(); await load();}catch(e){toast('ผิดพลาด: '+e.message)}
  busy=false; render();
}
const upd=async(patch)=>{const {error}=await db.from('players').update(patch).eq('id',me.id); if(error) throw error};
const EV_ROUNDS=[2,4,6,9,10,12,15,18,20,23,24,25]; // Event ขึ้นเมื่อจบรอบเหล่านี้ และมีผลในรอบถัดไป
const RARE_CHANCE=0.05; // โอกาสออก "สลับกระเป๋า" (ที่เหลือแบ่งเท่าๆ กัน)
const EVENTS={

  rain:{icon:'🌧️',title:'ฝนตกหนัก!',desc:'น้ำฝนเต็มโรงเบียร์ ทุกคนได้น้ำเพิ่ม 1 ใบ'},
  moldmalt:{icon:'🌾',title:'มอลต์ขึ้นรา!',desc:'ทุกคนที่มีมอลต์เสียมอลต์ 1 ใบ'},

  thief:{icon:'🕵️',title:'ขโมยเข้าโรงเบียร์!',desc:'ผู้ถือการ์ดมากที่สุดเสียการ์ดสุ่ม 1 ใบ'},
  inspector:{icon:'📋',title:'ผู้ตรวจสอบมาตรวจ!',desc:'ใครถือเกิน 5 ใบต้องทิ้งให้เหลือ 5 ใบ'},
  swapbag:{icon:'🎰',title:'สลับกระเป๋า!!',desc:'สุ่มผู้เล่น 2 คนสลับวัตถุดิบทั้งมือกัน',rare:true}
};
let seenEv=null, extraOpen=false, extraPick=null;
const curRound=()=>room?Math.floor((room.turn_count||0)/Math.max(1,players.length))+1:1;
const evActive=k=>!!room&&room.event===k&&room.event_round===curRound();
const duelOn=()=>!!room&&room.event==='duel'&&room.event_round===curRound()&&['pick','flip'].includes(room.duel_state);
const anyPending=()=>players.some(x=>x.pending)||duelOn();

const tot=x=>KEYS.reduce((a,k)=>a+x[k],0);
const rnd=a=>a[Math.random()*a.length|0];
const hand=x=>({water:x.water,malt:x.malt,hops:x.hops,yeast:x.yeast});
const setHand=(id,h)=>db.from('players').update(h).eq('id',id);
const setPending=(list,v)=>list.length?db.from('players').update({pending:v}).in('id',list.map(x=>x.id)):null;
const randCard=x=>{const bag=KEYS.flatMap(k=>Array(x[k]).fill(k));return bag.length?rnd(bag):null};
const twoRandom=ps=>[...ps].sort(()=>Math.random()-.5).slice(0,2);
const names=l=>l.map(x=>x.name).join(', ');

// สุ่ม Event (สลับกระเป๋า 5% / ที่เหลือเท่ากัน) — สุ่มไว้ล่วงหน้าเก็บใน rooms.next_event เพื่อให้การ์ดส่องอนาคตดูได้
function rollEvent(){
  if(Math.random()<RARE_CHANCE) return 'swapbag';
  return rnd(Object.keys(EVENTS).filter(k=>k!=='swapbag'));
}
// Event ที่ใช้ไม่ได้ในสถานการณ์นั้น (เช่น ไม่มีใครมีมอลต์) จะถูกสุ่มใหม่
function eligible(ev,ps){
  const mxP=Math.max(...ps.map(x=>x.beer_points));
  const ok={
    discard:ps.some(x=>tot(x)>0), discarddraw:ps.some(x=>tot(x)>0),
    moldmalt:ps.some(x=>x.malt>0), thief:ps.some(x=>tot(x)>0),
    inspector:ps.some(x=>tot(x)>5), duel:ps.length>=2,
    brawl:mxP>=1&&ps.some(x=>x.beer_points===mxP&&tot(x)>0)
  };
  return ev==='swapbag'?ps.length>=2:ok[ev]!==false;
}
function pickEvent(ps,want){
  if(want&&EVENTS[want]&&eligible(want,ps)) return want;
  for(let i=0;i<40;i++){const e=rollEvent(); if(eligible(e,ps)) return e}
  return 'notrade';
}
// ทำผลของ Event ที่เกิดทันที แล้วคืนข้อความสรุปให้แสดงในป๊อปอัป
async function runEvent(ev,ps){
  switch(ev){
    case 'discard': case 'discarddraw':
      await setPending(ps.filter(x=>tot(x)>0),ev==='discard'?'discard':'discard_draw'); return null;
    case 'rain': case 'yeastboom': {
      const k=ev==='rain'?'water':'yeast';
      await Promise.all(ps.map(x=>setHand(x.id,{[k]:x[k]+1}))); return `ทุกคนได้ ${ING[k].e} ${ING[k].th} เพิ่ม 1 ใบ`;}
    case 'moldmalt': {
      const hit=ps.filter(x=>x.malt>0);
      await Promise.all(hit.map(x=>setHand(x.id,{malt:x.malt-1})));
      return hit.length?`${names(hit)} เสีย 🌾 มอลต์ไป 1 ใบ`:'ไม่มีใครมีมอลต์ รอดตัวไป!';}
    case 'brawl': {
      const mx=Math.max(...ps.map(x=>x.beer_points)), L=ps.filter(x=>x.beer_points===mx&&tot(x)>0);
      await setPending(L,'discard'); return `ผู้นำแต้ม (${names(L)}) ถูกรุม! ต้องทิ้งวัตถุดิบ 1 ใบ`;}
    case 'thief': {
      const mt=Math.max(...ps.map(tot)), V=ps.filter(x=>tot(x)===mt), out=[];
      for(const x of V){const k=randCard(x),h=hand(x);h[k]--;await setHand(x.id,h);out.push(`${x.name} (${ING[k].e})`)}
      return `โจรบุก! คนถือการ์ดมากสุดโดนขโมยไป 1 ใบ: ${out.join(', ')}`;}
    case 'duel': {
      const [a,b]=twoRandom(ps);
      return {info:`${a.name} กับ ${b.name} ถูกสุ่มมาดวลเหรียญ! ใครเลือกหัว/ก้อยก่อนได้ก่อน ทายผิดแพ้`,
        patch:{duel_state:'pick',duel_a:a.id,duel_b:b.id,duel_caller:null,duel_side:null,duel_result:null,duel_at:Date.now()}};}
    case 'inspector': {
      const V=ps.filter(x=>tot(x)>5); await setPending(V,'trim');
      return `${names(V)} ถือเกิน 5 ใบ ต้องทิ้งให้เหลือ 5 ใบ`;}
    case 'swapbag': {
      const [a,b]=twoRandom(ps);
      await Promise.all([setHand(a.id,hand(b)),setHand(b.id,hand(a))]);
      return `${a.name} กับ ${b.name} สลับกระเป๋ากัน!`;}
  }
  return null; // notrade / extrabrew / hopsshort ใช้ผลตลอดรอบ
}
const TURN_SECS=45; // เวลาต่อเทิร์น (วินาที)
let cardTarget=null,peekMemo=null,peekShow=false;
let logOpen=!matchMedia('(max-width:640px)').matches;
let logs=[],soundedId=0,lastEvKey,onlineIds=new Set(),kickArm=null,fx=[],wasMine=false,autoBusy=false,autoFor=-1,lastTick=0;
const BAD=['notrade','discard','extrabrew','discarddraw','moldmalt','hopsshort','brawl','duel','thief','inspector','swapbag'];
const isHost=()=>!!me&&sorted()[0]?.id===me.id;
const logEv=(kind,msg,meta)=>db.from('game_log').insert({room_id:room.id,actor:me.id,kind,msg,meta:meta||null}).then(()=>{},()=>{});
function onLog(r){Music.sfx({draw:'draw',trade:'trade',brew:'brew',event:'event',win:'win',discard:'discard',skip:'skip',timeout:'skip',kick:'skip',card:'card',duel:'coin'}[r.kind]||'tick'); if(r.kind==='card'&&r.meta&&r.meta.card) cardAlert(r.meta)}
const setTurn=async(patch={})=>{
  const fxl=room.turn_fx||[];
  if(fxl.includes('double')){ // การ์ดเทิร์นซ้อน: ไม่เลื่อนเทิร์น ให้เล่น Action หลักอีกรอบ
    const {data:ok,error}=await db.from('rooms').update({turn_fx:fxl.filter(x=>x!=='double'),turn_deadline:Date.now()+TURN_SECS*1000,...patch}).eq('id',room.id).eq('turn_count',room.turn_count||0).select('id');
    if(error) throw error;
    if(ok?.length) logEv('card','⏩ เทิร์นซ้อน! ได้เล่น Action หลักต่ออีก 1 รอบ');
    return !!ok?.length;
  }
  const n=sorted().length, tc=(room.turn_count||0)+1;
  const u={current_turn:nextTurn(),turn_count:tc,turn_deadline:Date.now()+TURN_SECS*1000,turn_fx:[],...patch};
  let evMsg=null;
  if(tc%n===0&&EV_ROUNDS.includes(tc/n)){
    const {data}=await db.from('players').select().eq('room_id',room.id), ps=(data||[]).filter(x=>!x.kicked);
    const ev=pickEvent(ps,room.next_event), r=await runEvent(ev,ps), info=r&&typeof r==='object'?r.info:r;
    Object.assign(u,{event:ev,event_key:Math.random().toString(36).slice(2,9),event_round:tc/n+1,event_info:info,next_event:rollEvent()});
    if(r&&r.patch) Object.assign(u,r.patch);
    evMsg=`${EVENTS[ev].icon} Event: ${EVENTS[ev].title}${info?' — '+info:''}`;
  }
  // เงื่อนไข turn_count กันสองเครื่องเลื่อนเทิร์นซ้อนกัน
  const {data:ok,error}=await db.from('rooms').update(u).eq('id',room.id).eq('turn_count',room.turn_count||0).select('id');
  if(error) throw error;
  if(!ok?.length) return false;
  if(evMsg) logEv('event',evMsg);
  return true;
};

/* ---------- effects: shake / fly / score ---------- */
function shake(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const kf=[{transform:'translate(0,0)'},{transform:'translate(-9px,3px)'},{transform:'translate(8px,-4px)'},{transform:'translate(-6px,-3px)'},{transform:'translate(5px,4px)'},{transform:'translate(-3px,1px)'},{transform:'translate(0,0)'}];
  [...$('#app').children].forEach(c=>{if(!c.classList.contains('fixed')) c.animate(kf,{duration:520})});
  const f=document.createElement('div');f.className='flash';document.body.appendChild(f);
  f.animate([{opacity:0},{opacity:1},{opacity:0}],{duration:700}).onfinish=()=>f.remove();
}
function runFx(){
  while(fx.length){
    const f=fx.shift();
    if(f.t==='fly'){
      const src=document.querySelector(f.from||'.abtn.draw'), tgt=document.querySelector(`[data-k="${f.k}"]`);
      if(!src||!tgt) continue;
      const sr=src.getBoundingClientRect(), tr=tgt.getBoundingClientRect();
      const g=document.createElement('div'); g.className='flyc'; g.innerHTML=`<img src="${CARD_IMG[f.k]}" style="width:100%;height:100%;display:block;border-radius:6%/4%">`;
      g.style.cssText=`left:${sr.left+sr.width/2-28}px;top:${sr.top}px`; document.body.appendChild(g);
      const dx=tr.left+tr.width/2-(sr.left+sr.width/2), dy=tr.top+tr.height/2-sr.top-39;
      g.animate([{transform:'translate(0,0) scale(.6) rotate(-15deg)',opacity:0},{transform:'translate(0,-40px) scale(1.15) rotate(8deg)',opacity:1,offset:.3},{transform:`translate(${dx}px,${dy}px) scale(.8) rotate(0deg)`,opacity:1}],{duration:700,easing:'cubic-bezier(.5,0,.3,1)'}).onfinish=()=>g.remove();
      tgt.animate([{transform:'scale(1)'},{transform:'scale(1.18) translateY(-8px)'},{transform:'scale(1)'}],{duration:420,delay:620});
    }
    if(f.t==='score'){
      const ps=document.querySelectorAll('#mepips .pip.on'), el=ps[ps.length-1]; if(!el) continue;
      el.animate([{transform:'scale(.2) rotate(-40deg)'},{transform:'scale(1.9) rotate(10deg)'},{transform:'scale(1)'}],{duration:700,easing:'cubic-bezier(.2,1.6,.4,1)'});
      const r=el.getBoundingClientRect(), t=document.createElement('div'); t.className='plus1'; t.textContent='+1 🍺';
      t.style.cssText=`left:${r.left}px;top:${r.top-6}px`; document.body.appendChild(t);
      t.animate([{transform:'translateY(0)',opacity:1},{transform:'translateY(-60px)',opacity:0}],{duration:1100,easing:'ease-out'}).onfinish=()=>t.remove();
    }
  }
}

/* ---------- turn timer / host tools ---------- */
function tickTimer(){
  if(!room||room.status!=='playing'||!room.turn_deadline) return;
  duelWatch();
  const paused=anyPending(), left=Math.ceil((room.turn_deadline-Date.now())/1000);
  const bar=$('#tbar'), txt=$('#ttxt');
  if(bar){bar.style.width=(paused?100:Math.max(0,Math.min(100,left/TURN_SECS*100)))+'%';bar.parentElement.parentElement.classList.toggle('low',!paused&&left<=10)}
  if(txt) txt.textContent=paused?'⏸ รอ Event':`⏱️ ${Math.max(left,0)} วิ`;
  if(paused) return;
  if(myTurn()&&left<=5&&left>0&&left!==lastTick){lastTick=left;Music.sfx('tick')}
  if(left<=0) enforce();
}
setInterval(tickTimer,250);
function enforce(){
  const cur=current(); if(!cur||anyPending()) return;
  const over=Date.now()-room.turn_deadline;
  if(cur.id===me.id||over>=5000+(mine().seat||0)*1500) autoDraw(cur); // คนอื่นช่วยเดินให้ถ้าเจ้าของเทิร์นหลุด (หน่วงตามลำดับที่นั่ง กันชนกัน)
}
async function autoDraw(target){
  if(busy||autoBusy||autoFor===room.turn_count) return; autoBusy=true; autoFor=room.turn_count;
  try{
    const {data:r}=await db.from('rooms').select('turn_count,status').eq('id',room.id).single();
    if(!r||r.status!=='playing'||r.turn_count!==room.turn_count) return;
    const {data:t}=await db.from('players').select().eq('id',target.id).single(); if(!t) return;
    const pool=evActive('hopsshort')?KEYS.filter(x=>x!=='hops'):KEYS, k=rnd(pool);
    await db.from('players').update({[k]:t[k]+1}).eq('id',t.id);
    tradeOpen=false; extraOpen=false;
    await logEv('timeout',`⏱️ หมดเวลา! ระบบจั่ว ${ING[k].e} ให้ ${t.name}`);
    await setTurn();
  }catch(e){}finally{autoBusy=false;await load();render()}
}
async function skipTurn(){
  if(!isHost()||anyPending()||busy) return; const cur=current(); if(!cur||cur.id===me.id) return; busy=true;
  try{const ok=await setTurn(); if(ok) await logEv('skip',`⏭️ โฮสต์ข้ามเทิร์นของ ${cur.name}`)}catch(e){toast('ผิดพลาด: '+e.message)}
  busy=false; await load(); render();
}
async function forceResolve(){
  if(!isHost()) return;
  if(duelOn()){await hostDuel();return}
  const {data}=await db.from('players').select().eq('room_id',room.id);
  for(const x of (data||[]).filter(y=>y.pending&&!y.kicked)){
    const c=hand(x), take=()=>{const k=randCard(c);if(k)c[k]--};
    take(); if(x.pending==='discard_draw') c[rnd(KEYS)]++;
    if(x.pending==='trim') while(tot(c)>5) take();
    await db.from('players').update({...c,pending:null}).eq('id',x.id);
  }
  await db.from('rooms').update({turn_deadline:Date.now()+TURN_SECS*1000}).eq('id',room.id);
  await logEv('skip','🎲 โฮสต์บังคับทิ้งสุ่มให้ผู้เล่นที่ยังไม่เลือก');
  await load(); render();
}
function kickClick(id){
  if(kickArm===id){kickArm=null;kickPlayer(id)}
  else{kickArm=id;render();setTimeout(()=>{if(kickArm===id){kickArm=null;render()}},3000)}
}
async function kickPlayer(id){
  if(!isHost()||id===me.id) return;
  const s=sorted(), n=s.length, idx=s.findIndex(x=>x.id===id); if(idx<0) return;
  const t=s[idx];
  const {error}=await db.from('players').update({kicked:true,pending:null}).eq('id',id); if(error) return toast('ผิดพลาด: '+error.message);
  logEv('kick',`🚪 โฮสต์เตะ ${t.name} ออกจากห้อง`);
  if(room.status==='playing'){
    const n2=n-1;
    if(n2<2){const w=s.find(x=>x.id!==id); await db.from('rooms').update({status:'finished',winner_id:w.id}).eq('id',room.id); logEv('win',`🏆 ${w.name} ชนะเกม (เหลือผู้เล่นคนเดียว)`)}
    else{
      const ci=room.current_turn%n; let ni=idx<ci?ci-1:ci; if(ni>=n2) ni=0;
      await db.from('rooms').update({current_turn:ni,turn_count:(curRound()-1)*n2+ni,turn_deadline:Date.now()+TURN_SECS*1000}).eq('id',room.id);
    }
  }
  await load(); render();
}

/* ---------- แบนเนอร์ประกาศการใช้การ์ด (ทุกคนเห็น) + แจ้งเตือนเหยื่อล้วงกระเป๋า ---------- */
function showBanner(icon,title,sub,cls){
  document.querySelectorAll('.cbwrap').forEach(e=>e.remove());
  const w=document.createElement('div'); w.className='cbwrap';
  w.innerHTML=`<div class="cbanner ${cls||''}"><span class="ci">${icon}</span><div class="ct"><b>${esc(title)}</b><span>${esc(sub||'')}</span></div></div>`;
  document.body.appendChild(w);
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  w.firstChild.animate(still
    ?[{opacity:0},{opacity:1,offset:.1},{opacity:1,offset:.88},{opacity:0}]
    :[{transform:'translateY(-30px) scale(.7)',opacity:0},{transform:'translateY(0) scale(1.06)',opacity:1,offset:.12},{transform:'translateY(0) scale(1)',opacity:1,offset:.2},{transform:'translateY(0) scale(1)',opacity:1,offset:.86},{transform:'translateY(-14px) scale(.96)',opacity:0}],
    {duration:3200,easing:'ease-out'}).onfinish=()=>w.remove();
}
function cardAlert(m){
  const c=CARDS[m.card]; if(!c) return;
  if(m.card==='pickpocket'&&m.took&&m.targetId===me?.id){ // เหยื่อ: หน้าจอสั่น + วาบแดง + บอกว่าเสียอะไร
    shake(); Music.sfx('skip');
    showBanner(c.icon,`${m.by} ล้วงกระเป๋าคุณ!`,`เสีย ${ING[m.took].e} ${ING[m.took].th} 1 ใบ`,'danger'); return;
  }
  showBanner(c.icon,`${m.by} ใช้การ์ด ${c.name}`,m.target?`เป้าหมาย: ${m.target}`:c.desc,c.rare?'rare':'');
}
/* ---------- Action Cards ----------
   เพิ่มการ์ดใหม่: เพิ่มรายการใน CARDS
   w = น้ำหนักโอกาสออก (รวมกัน 100 จะอ่านเป็น % ได้เลย) · rare = ป้าย RARE · target = ต้องเลือกผู้เล่นเป้าหมาย (pool กรองเป้าหมาย)
   can(p) = คืน null ถ้าใช้ได้ หรือข้อความเหตุผลที่ใช้ไม่ได้ · use({p,t}) = ทำผล แล้วคืนข้อความที่จะลงบันทึก (หรือ null)
   กติกา: ใช้ได้ 1 ใบ/เทิร์น ฟรี ก่อนทำ Action หลัก — ผลระยะเทิร์นเก็บใน rooms.turn_fx แล้วล้างเมื่อเปลี่ยนเทิร์น */
const myFx=k=>(room?.turn_fx||[]).includes(k)&&myTurn();
const tradeNeed=()=>myFx('kindtrade')?1:2;
const brewOK=p=>{const n=KEYS.filter(k=>p[k]>=1).length;return myFx('secret')?n>=3:n===4};
const cardUsed=()=>!!room&&room.card_used_turn===room.turn_count;
const nextEvRound=()=>EV_ROUNDS.find(r=>r>=curRound());
const addFx=k=>db.from('rooms').update({turn_fx:[...(room.turn_fx||[]),k]}).eq('id',room.id);

const FXN={kindtrade:'🤝 แลกใจดี: เทิร์นนี้แลกเปลี่ยน 1 ต่อ 1',secret:'🧪 สูตรลับ: เทิร์นนี้ปรุงเบียร์ขาดวัตถุดิบได้ 1 ชนิด',double:'⏩ เทิร์นซ้อน: จบ Action หลักแล้วได้เล่นต่ออีก 1 รอบ'};
function pickCard(){
  let r=Math.random()*Object.values(CARDS).reduce((a,c)=>a+c.w,0);
  for(const [id,c] of Object.entries(CARDS)){r-=c.w;if(r<0)return id}
  return 'kindtrade';
}
function cardState(id){
  if(!myTurn()) return 'ยังไม่ถึงเทิร์นของคุณ';
  if(anyPending()||busy) return 'รอสักครู่';
  if(cardUsed()) return 'ใช้การ์ดได้ 1 ใบต่อเทิร์น';
  return CARDS[id].can(mine());
}
function cardClick(id){
  if(cardState(id)) return;
  if(CARDS[id].target){cardTarget=id;render()} else useCard(id);
}
function pickTarget(tid){const c=cardTarget;cardTarget=null;useCard(c,tid)}
async function useCard(cid,tid){
  const c=CARDS[cid], p=mine();
  if(!c||cardState(cid)||(c.target&&!tid)) return;
  busy=true;
  try{
    const {data:ok,error}=await db.from('rooms').update({card_used_turn:room.turn_count}).eq('id',room.id).eq('turn_count',room.turn_count).select('id');
    if(error) throw error; if(!ok?.length) return;
    const cards=[...(p.cards||[])]; cards.splice(cards.indexOf(cid),1);
    await db.from('players').update({cards}).eq('id',me.id);
    const t=tid?players.find(x=>x.id===tid):null;
    const r=await c.use({p,t}), msg=r&&typeof r==='object'?r.msg:r;
    await logEv('card',`${p.name} ใช้การ์ด ${c.icon} ${c.name}${msg?' — '+msg:''}`,{card:cid,by:p.name,target:t?t.name:null,targetId:t?t.id:null,...(r&&typeof r==='object'?r.meta:{})});
  }catch(e){toast('ผิดพลาด: '+e.message)}
  finally{busy=false;await load();render()}
}

}

function drawCard(){act(async()=>{
  const pool=evActive('hopsshort')?KEYS.filter(x=>x!=='hops'):KEYS, k=rnd(pool), p=mine();
  await upd({[k]:p[k]+1}); logEv('draw',`${p.name} จั่ว ${ING[k].e}`); fx.push({t:'fly',k}); await setTurn(); toast(`จั่วได้ ${ING[k].e} ${ING[k].th}`);
})}
function openTrade(){ if(!myTurn()||evActive('notrade')||anyPending()) return; tradeOpen=true; give={water:0,malt:0,hops:0,yeast:0}; want=null; render() }
function giveAdj(k,d){
  const p=mine(), tot=KEYS.reduce((s,x)=>s+give[x],0);
  if(d>0&&(tot>=tradeNeed()||give[k]>=p[k])) return;
  if(d<0&&give[k]<=0) return;
  give[k]+=d; render();
}
function doTrade(){act(async()=>{
  const p=mine(), patch={};
  KEYS.forEach(k=>patch[k]=p[k]-give[k]); patch[want]+=1;
  await upd(patch); tradeOpen=false; logEv('trade',`${p.name} แลกเปลี่ยน → ได้ ${ING[want].e}`); fx.push({t:'fly',k:want,from:'.abtn.trade'}); await setTurn();
})}
function brewClick(){ if(evActive('extrabrew')){extraOpen=true;extraPick=null;render()} else brew() }
function brew(extra){act(async()=>{
  const p=mine(); if(!brewOK(p)) return toast('วัตถุดิบไม่ครบ');
  const patch={beer_points:p.beer_points+1}; KEYS.forEach(k=>patch[k]=p[k]-(p[k]>=1?1:0));
  if(evActive('extrabrew')){
    if(!extra||patch[extra]<1) return toast('ต้องเลือกวัตถุดิบเพิ่ม 1 ใบ');
    patch[extra]-=1;
  }
  await upd(patch); extraOpen=false;
  fx.push({t:'score'}); logEv('brew',`${p.name} ปรุงเบียร์! 🍺 (${patch.beer_points}/${WIN})`);
  if(patch.beer_points>=WIN) logEv('win',`🏆 ${p.name} ชนะเกม!`);
  if(patch.beer_points>=WIN) await db.from('rooms').update({status:'finished',winner_id:me.id}).eq('id',room.id);
  else await setTurn();
})}
async function discardPick(k){
  const p=mine(); if(!p.pending||p[k]<1) return;
  const c=hand(p); c[k]--;
  let got=null, next=null;
  if(p.pending==='discard_draw'){got=rnd(KEYS);c[got]++}
  if(p.pending==='trim'&&tot(c)>5) next='trim';
  const {error}=await db.from('players').update({...c,pending:next}).eq('id',me.id);
  if(error) return toast('ผิดพลาด: '+error.message);
  logEv('discard',`${p.name} ทิ้งวัตถุดิบ 1 ใบ`);
  if(!next){const {data:pd}=await db.from('players').select('pending,kicked').eq('room_id',room.id); if(!(pd||[]).some(x=>x.pending&&!x.kicked)) await db.from('rooms').update({turn_deadline:Date.now()+TURN_SECS*1000}).eq('id',room.id)}
  toast(got?`ทิ้ง ${ING[k].th} · จั่วได้ ${ING[got].e} ${ING[got].th}`:`ทิ้ง ${ING[k].th} แล้ว`);
  await load(); render();
}
async function rematch(){
  await db.from('game_log').delete().eq('room_id',room.id);
  await db.from('players').update({water:0,malt:0,hops:0,yeast:0,beer_points:0,pending:null,cards:[]}).eq('room_id',room.id);
  await db.from('rooms').update({status:'waiting',current_turn:0,winner_id:null,turn_count:0,event:null,event_key:null,event_round:0,event_info:null,turn_deadline:null,card_used_turn:-1,turn_fx:[],next_event:null,duel_state:null,duel_caller:null}).eq('id',room.id);

  const confetti=room.status==='finished'?Array.from({length:36},(_,i)=>`<span class="conf" style="left:${Math.random()*100}%;background:${['#ffc43d','#ff6b4a','#6fdc5a','#4cc3e8','#d98cff'][i%5]};animation-delay:${(Math.random()*3).toFixed(2)}s;animation-duration:${(2.5+Math.random()*2).toFixed(2)}s"></span>`).join(''):'';
  return head(true)+`
  <div class="flex justify-between items-center mb-3 pr-14">
    <button class="chip" onclick="copyCode()">🔑 ${room.code} ⧉</button>
    <span class="chip">🔄 รอบ ${curRound()}</span>
    <button class="chip" onclick="leave()">🚪 ออก</button></div>
  <div class="ribbon ${t?'mine':''}">${t?'⚔️ ถึงเทิร์นของคุณ! ลุยเลย!':'⏳ รอ '+esc(cur?.name||'')+' เล่น…'}</div>
  ${timerHTML}
  ${hostBar}
  ${evBar}
  ${fxBar}
  ${peekChip}
  ${others?`<div class="oppgrid">${others}</div><div class="vs">⚔️ VS ⚔️</div>`:''}
  <div class="wood p-4 ${t?'turn':''}">
    <div class="flex items-center gap-3 mb-3">${av(p)}<div class="flex-1 min-w-0"><div class="font-bold text-lg truncate">${esc(p.name)}</div><div class="pips" id="mepips">${pips(p.beer_points)}</div></div><div class="text-right text-xs text-amber-200/60">${total} การ์ด</div></div>
    ${rec}
    <div class="hand">${KEYS.map(k=>cardHTML(k,p[k])).join('')}</div>
    ${cardsHTML}
    <div class="actbar grid grid-cols-3 gap-3">
      <button class="abtn draw" ${dis(true)} onclick="drawCard()"><span class="ai">🃏</span><span class="at">จั่วการ์ด</span><span class="as">สุ่ม +1 ชิ้น</span></button>
      <button class="abtn trade" ${dis(total>=tradeNeed()&&!noTrade)} onclick="openTrade()"><span class="ai">${noTrade?'🚫':'🔄'}</span><span class="at">แลกเปลี่ยน</span><span class="as">${noTrade?'ห้ามในรอบนี้':`${tradeNeed()} ชิ้น → 1 ชิ้น`}</span></button>
      <button class="abtn brew ${t&&canBrewNow?'ready':''}" ${dis(canBrewNow)} onclick="brewClick()"><span class="ai">🍻</span><span class="at">ปรุงเบียร์</span><span class="as">${extraNeed?'อย่างละ 1 + เพิ่ม 1 ใบ':'อย่างละ 1 → +1 แต้ม'}</span></button>
    </div></div>

/* ---------- ดวลเหรียญ (Event ดวลวัตถุดิบ) ---------- */
let duelAuto=false, duelFin=false, duelTimer=null;
async function claimDuel(cid,side){
  const result=Math.random()<.5?'head':'tail';
  const {data,error}=await db.from('rooms').update({duel_caller:cid,duel_side:side,duel_result:result,duel_state:'flip',duel_at:Date.now()}).eq('id',room.id).eq('duel_state','pick').is('duel_caller',null).select('id');
  if(error){toast('ผิดพลาด: '+error.message);return false}
  if(!data?.length){toast('อีกฝ่ายเลือกไปก่อนแล้ว');return false}
  const who=players.find(x=>x.id===cid);
  logEv('duel',`🤺 ${who?.name||'?'} เลือก ${side==='head'?'🧔 หัว':'🍺 ก้อย'}`);
  return true;
}
async function duelPick(side){
  if(!duelOn()||room.duel_state!=='pick'||![room.duel_a,room.duel_b].includes(me.id)) return;
  await claimDuel(me.id,side); await load(); render();
}
async function hostDuel(){ // โฮสต์สุ่มแทน / ยกเลิกถ้าผู้เล่นหลุด
  if(!isHost()||!duelOn()) return;
  const a=players.find(x=>x.id===room.duel_a), b=players.find(x=>x.id===room.duel_b);
  if(!a||!b){await db.from('rooms').update({duel_state:'done',event_info:'ดวลถูกยกเลิก (ผู้เล่นออกจากห้อง)',turn_deadline:Date.now()+TURN_SECS*1000}).eq('id',room.id);return}
  if(room.duel_state==='pick') await claimDuel(a.id,rnd(['head','tail'])); else await finishDuel();
  await load(); render();
}
async function finishDuel(){
  if(duelFin||room.duel_state!=='flip') return; duelFin=true;
  try{
    const {data:ok}=await db.from('rooms').update({duel_state:'done'}).eq('id',room.id).eq('duel_state','flip').select('id');
    if(!ok?.length) return;
    const other=room.duel_caller===room.duel_a?room.duel_b:room.duel_a;
    const wid=room.duel_result===room.duel_side?room.duel_caller:other, lid=wid===room.duel_a?room.duel_b:room.duel_a;
    const {data:rows}=await db.from('players').select().in('id',[wid,lid]);
    const w=rows.find(x=>x.id===wid), l=rows.find(x=>x.id===lid), k=randCard(l), res=room.duel_result==='head'?'🧔 หัว':'🍺 ก้อย';
    let info=`เหรียญออก ${res}! ${w.name} ชนะ แต่ ${l.name} ไม่มีอะไรให้แย่ง`;
    if(k){await Promise.all([setHand(w.id,{[k]:w[k]+1}),setHand(l.id,{[k]:l[k]-1})]); info=`เหรียญออก ${res}! ${w.name} ชนะ และแย่ง ${ING[k].e} ${ING[k].th} จาก ${l.name}`}
    await db.from('rooms').update({event_info:info,turn_deadline:Date.now()+TURN_SECS*1000}).eq('id',room.id);
    logEv('event','🤺 '+info);
  }catch(e){}finally{duelFin=false}
}
function duelWatch(){
  if(!duelOn()||!me) return;
  const age=Date.now()-(room.duel_at||0), mineD=[room.duel_a,room.duel_b].includes(me.id);
  if(room.duel_state==='pick'&&!room.duel_caller&&!duelAuto){
    if(mineD&&age>20000){duelAuto=true;duelPick(rnd(['head','tail'])).finally(()=>duelAuto=false)}      // ไม่มีใครเลือกใน 20 วิ → สุ่มให้
    else if(isHost()&&!mineD&&age>30000){duelAuto=true;hostDuel().finally(()=>duelAuto=false)}          // ทั้งคู่หลุด → โฮสต์สุ่มแทน
  }
  if(room.duel_state==='flip'&&age>2600&&(mineD||isHost())) finishDuel();
}
function duelSched(){ // รีเรนเดอร์ตอนเหรียญหยุดหมุน เพื่อเฉลยผล
  clearTimeout(duelTimer);
  if(room&&room.status==='playing'&&room.event==='duel'&&room.duel_state==='flip'){const left=2500-(Date.now()-room.duel_at); if(left>0) duelTimer=setTimeout(render,left+60)}
}
function coinHTML(){
  const st=room.duel_state, fl=st==='flip'||st==='done', d=fl?`animation-delay:-${Math.min(Date.now()-(room.duel_at||0),4000)}ms`:'';
  return `<div class="coinbox"><div class="coinhop ${fl?'hop':''}" style="${d}"><div class="coin ${fl?'cf-'+room.duel_result:'cf-idle'}" style="${d}"><div class="cface hd"><span>🧔</span><b>HEADS</b></div><div class="cface tl"><span>🍺</span><b>TAILS</b></div></div></div></div>`;
}
function duelHTML(p){
  const a=players.find(x=>x.id===room.duel_a), b=players.find(x=>x.id===room.duel_b), st=room.duel_state;
  const nm=x=>x?esc(x.name):'?', TH={head:'🧔 หัว',tail:'🍺 ก้อย'}, opp={head:'tail',tail:'head'};
  const iAm=[room.duel_a,room.duel_b].includes(me.id), caller=players.find(x=>x.id===room.duel_caller);
  const revealed=st==='done'||(st==='flip'&&Date.now()-(room.duel_at||0)>=2500);
  let body='';
  if(st==='pick'){
    body=iAm?`<div class="text-amber-300 mb-3">เลือกก่อนได้ก่อน! ทายผิดแพ้</div><div class="flex gap-3 justify-center"><button class="btn" onclick="duelPick('head')">🧔 หัว</button><button class="btn alt" onclick="duelPick('tail')">🍺 ก้อย</button></div>`
      :`<div class="text-amber-300 animate-pulse">⏳ รอ ${nm(a)} และ ${nm(b)} เลือกหัว/ก้อย…</div>`;
  }else{
    const cs=room.duel_side, oth=caller?.id===room.duel_a?b:a;
    body=`<div class="duelsel"><span>${nm(caller)} เลือก ${TH[cs]}</span><span>${nm(oth)} ได้ ${TH[opp[cs]]}</span></div>`;
    if(!revealed) body+=`<div class="text-amber-300 animate-pulse mt-3">🪙 กำลังทอยเหรียญ…</div>`;
    else{
      const win=room.duel_result===cs?caller:oth;
      body+=`<div class="duelres">เหรียญออก ${TH[room.duel_result]}<br>🏆 ${nm(win)} ชนะ!</div>${st==='done'&&room.event_info?`<div class="evinfo">${esc(room.event_info)}</div>`:''}`;
      if(st==='done') body+=`<button class="btn w-full mt-3" onclick="seenEv='${room.event_key}';render()">รับทราบ ลุยต่อ! ⚔️</button>`;
    }
  }
  return `<div class="fixed inset-0 bg-black/80 flex items-center justify-center z-40 p-4"><div class="wood p-6 text-center max-w-sm w-full"><div class="evtag">⚡ SITUATION EVENT · 🤺 ดวลเหรียญ</div><div class="flex items-center justify-center gap-3 my-3">${a?av(a):''}<b>${nm(a)}</b><span>⚔️</span><b>${nm(b)}</b>${b?av(b):''}</div>${coinHTML()}${body}</div></div>`;
}
function eventHTML(p){
  if(room.event==='duel'&&room.duel_state) return duelHTML(p);
  const ev=EVENTS[room.event], pend=p.pending, waitN=players.filter(x=>x.pending&&x.id!==me.id).length;
  let body='';
  if(pend) body=`<div class="text-sm text-amber-300 mb-3">${pend==='discard_draw'?'เลือกวัตถุดิบที่จะทิ้ง (แล้วจั่วใหม่ 1 ใบ)':pend==='trim'?`ต้องทิ้งให้เหลือ 5 ใบ (ทิ้งอีก ${tot(p)-5} ใบ)`:'เลือกวัตถุดิบที่จะทิ้ง 1 ใบ'}</div><div class="flex flex-wrap gap-3 justify-center">${KEYS.map(k=>`<button class="pickc" ${p[k]<1?'disabled':''} onclick="discardPick('${k}')">${mini(k)}<b>×${p[k]}</b></button>`).join('')}</div>`;
  else if(waitN>0) body=`<div class="text-amber-300 animate-pulse">⏳ รอผู้เล่นอื่นเลือก… (${waitN} คน)</div>`;
  else body=`<button class="btn w-full" onclick="seenEv='${room.event_key}';render()">รับทราบ ลุยต่อ! ⚔️</button>`;
  return `<div class="fixed inset-0 bg-black/80 flex items-center justify-center z-40 p-4"><div class="wood p-6 text-center max-w-sm w-full">
    <div class="evicon">${ev.icon}</div><div class="evtag ${ev.rare?'rare':''}">${ev.rare?'💎 RARE EVENT':'⚡ SITUATION EVENT'} · จบรอบที่ ${room.event_round-1}</div>
    <div class="evtitle ${ev.rare?'rare-t':''}">${ev.title}</div><div class="evdesc">${ev.desc}</div>${room.event_info?`<div class="evinfo">${esc(room.event_info)}</div>`:''}${body}</div></div>`;
}
function logBox(){
  const all=[...logs].reverse(), l=logOpen?all.slice(0,20):all.slice(0,1);
  return `<div class="logbox"><button class="logh" onclick="logOpen=!logOpen;render()"><span>📜 บันทึกเหตุการณ์</span><span>${logOpen?'▾ ย่อ':'▸ ดูทั้งหมด'}</span></button><div class="logl">${l.length?l.map(x=>`<div class="logi ${esc(x.kind||'')}">${esc(x.msg)}</div>`).join(''):'<div class="logi">ยังไม่มีเหตุการณ์</div>'}</div></div>`;
}
function tradeHTML(p){
  const tt=KEYS.reduce((s,k)=>s+give[k],0);
  return `<div class="fixed inset-0 bg-black/70 flex items-center justify-center z-30 p-4"><div class="wood rounded-2xl p-5 w-full max-w-md">
    <div class="font-bold text-lg mb-2">🔄 แลกเปลี่ยน</div>
    <div class="text-sm text-amber-300 mb-2">สละ ${tradeNeed()} ชิ้น (เลือกแล้ว ${tt}/${tradeNeed()})</div>
    <div class="grid grid-cols-4 gap-2 mb-4">${KEYS.map(k=>`<div class="text-center">${mini(k,give[k]?'sel':'')}<div class="text-xs mt-1">มี ${p[k]}</div>
      <div class="flex justify-center items-center gap-1 mt-1"><button class="px-2 bg-amber-900 rounded" onclick="giveAdj('${k}',-1)">−</button><b>${give[k]}</b><button class="px-2 bg-amber-700 rounded" onclick="giveAdj('${k}',1)">+</button></div></div>`).join('')}</div>
    <div class="text-sm text-amber-300 mb-2">รับ 1 ชิ้น</div>
    <div class="grid grid-cols-4 gap-2 mb-4">${KEYS.map(k=>`<button class="text-center" onclick="want='${k}';render()">${mini(k,want===k?'sel':(want?'dim':''))}</button>`).join('')}</div>
    <div class="flex gap-2"><button class="btn flex-1" ${tt===tradeNeed()&&want?'':'disabled'} onclick="doTrade()">ยืนยันแลก</button>
    <button class="flex-1 rounded-xl border border-amber-700" onclick="tradeOpen=false;render()">ยกเลิก</button></div></div></div>`;
}
/* ---------- กันซูมจากการแตะ 2 ที (iOS) — ปุ่ม/ช่องกรอกจัดการด้วย touch-action อยู่แล้ว ---------- */
let _lt=0;
document.addEventListener('touchend',e=>{
  const n=Date.now();
  if(n-_lt<350&&e.cancelable&&!e.target.closest('button,input,a,label')) e.preventDefault();
  _lt=n;
},{passive:false});

/* ---------- 8-bit music (synthesized, original tune) ---------- */
const Music=(()=>{
  let ctx,master,noiseBuf,step=0,next=0,timer;
  let enabled=true; try{enabled=localStorage.getItem('bw_music')!=='off'}catch(e){}
  const btn=document.getElementById('musicBtn'), STEP=60/150/2; // 150 BPM, eighth notes
  const hz=m=>440*Math.pow(2,(m-69)/12);
  // 4 bars (C - Am - F - G), 8 eighth-notes per bar; 0 = rest
  const MEL=[72,76,79,76,72,76,79,84, 81,76,72,76,81,79,76,0, 77,81,84,81,77,79,81,77, 79,83,86,83,79,74,79,0];
  const BASS=[[36,43],[45,40],[41,48],[43,50]];
  function tone(type,f,t,d,v){
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.02);
  }
  function hat(t,v){
    const s=ctx.createBufferSource(),g=ctx.createGain();
    s.buffer=noiseBuf;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.04);
    s.connect(g);g.connect(master);s.start(t);s.stop(t+0.05);
  }
  function kick(t){
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+0.1);
    g.gain.setValueAtTime(0.5,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.12);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+0.15);
  }
  function schedule(){
    while(next<ctx.currentTime+0.25){
      const s=step%32, bar=s>>3, i=s&7, t=next;
      if(MEL[s]) tone('square',hz(MEL[s]),t,STEP*0.85,0.16);
      const b=BASS[bar]; if(i%2===0) tone('triangle',hz(b[(i/2)%2]),t,STEP*1.7,0.32);
      if(i===0||i===4) kick(t);
      hat(t,i%2?0.07:0.035);
      next+=STEP;step++;
    }
  }
  function init(){
    if(ctx) return;
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    ctx=new AC();master=ctx.createGain();master.gain.value=0.35;master.connect(ctx.destination);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate*0.1,ctx.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    next=ctx.currentTime+0.1;timer=setInterval(schedule,50);
  }
  function apply(){
    btn.textContent=enabled?'🔊':'🔇';
    if(ctx) enabled?ctx.resume():ctx.suspend();
  }
  // browsers need a user gesture before audio can start
  document.addEventListener('pointerdown',()=>{ if(enabled&&!ctx){init();apply()} });
  btn.addEventListener('click',()=>{
    enabled=!enabled;
    try{localStorage.setItem('bw_music',enabled?'on':'off')}catch(e){}
    if(enabled&&!ctx) init();
    apply();
  });
  btn.textContent=enabled?'🔊':'🔇';
  // ---- sound effects (ใช้ปุ่ม 🔊/🔇 เดียวกับเพลง) ----
  function seq(type,list,d,v){const t0=ctx.currentTime+0.01;list.forEach(([f,o])=>tone(type,f,t0+o,d,v))}
  const SFX={
    draw:()=>{hat(ctx.currentTime,0.25);seq('square',[[740,.02],[988,.08]],.1,.14)},
    trade:()=>seq('square',[[523,0],[659,.07],[523,.14],[784,.21]],.09,.13),
    brew:()=>{seq('square',[[523,0],[659,.08],[784,.16],[1047,.24]],.12,.14);seq('sine',[[2093,.34],[2637,.42]],.45,.18)},
    event:()=>{hat(ctx.currentTime,.5);seq('sawtooth',[[392,0],[523,.16],[392,.32],[523,.48]],.14,.1);seq('triangle',[[1760,0]],.55,.2)},
    win:()=>seq('square',[[523,0],[659,.12],[784,.24],[1047,.36],[784,.5],[1047,.62],[1319,.76]],.18,.15),
    turn:()=>seq('sine',[[988,0],[1319,.1]],.25,.2),
    discard:()=>seq('triangle',[[330,0],[247,.09],[165,.18]],.14,.25),
    skip:()=>seq('square',[[660,0],[440,.1]],.12,.12),
    card:()=>seq('sine',[[880,0],[1175,.07],[1568,.14],[2093,.21]],.18,.16),
    coin:()=>{seq('triangle',[[1568,0],[2093,.07],[1568,.14],[2093,.21]],.1,.18);seq('sine',[[2637,2.35],[3136,2.4]],.4,.2)},
    tick:()=>seq('square',[[1200,0]],.05,.1)
  };
  function sfx(n){if(!ctx||!enabled||ctx.state!=='running')return;try{SFX[n]&&SFX[n]()}catch(e){}}
  return {sfx};
})();

restore();
